<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Curtain Up 테스트</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column. A dark "stage" card shows what to sing now (tap = pause); settings below; a sticky play bar at the bottom. */
:root{
  --bg:#f6f1f3; --surface:#ffffff; --ink:#2a1520; --muted:#7a6470; --line:#e7dce1;
  --accent:#8c1d40; --accent-ink:#ffffff; --brass:#a87a22;
  --stage-bg:#22111a; --stage-ink:#f6ecf0; --stage-muted:#b69fab; --stage-lamp:#f1c76b; --stage-dim:#4a3440;
  --good:#6fdc9c; --warn:#f1c76b; --off:#ff8fa3;
  --display:"Bricolage Grotesque","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140b10; --surface:#1e1318; --ink:#f3e9ee; --muted:#b39fa9; --line:#352630;
    --accent:#e0607f; --accent-ink:#22060f; --brass:#e2b45a;
    --stage-bg:#0b0609; --stage-dim:#3a2832;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140b10; --surface:#1e1318; --ink:#f3e9ee; --muted:#b39fa9; --line:#352630;
  --accent:#e0607f; --accent-ink:#22060f; --brass:#e2b45a;
  --stage-bg:#0b0609; --stage-dim:#3a2832;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.app{max-width:480px;margin:0 auto;display:grid;gap:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brandwrap{display:grid;gap:2px}
.brand{font:800 26px/1 var(--display);letter-spacing:-.6px}
.brand span{color:var(--accent)}
.tag{font-size:13px;color:var(--muted)}
.lang{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 10px;font:500 13px var(--body);cursor:pointer}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* stage */
.stage{position:relative;overflow:hidden;border-radius:22px;background:var(--stage-bg);color:var(--stage-ink);padding:20px 20px 18px;display:grid;gap:14px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(120% 70% at 50% -10%, color-mix(in srgb,var(--stage-lamp) 28%,transparent), transparent 60%)}
.stage.paused{background-image:radial-gradient(120% 70% at 50% -10%, color-mix(in srgb,var(--stage-lamp) 10%,transparent), transparent 60%)}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--stage-muted);letter-spacing:.04em}
.stage-top #exName{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--stage-dim)}
.stage.playing .live i{background:var(--stage-lamp);box-shadow:0 0 10px var(--stage-lamp)}
.key{display:grid;gap:2px;text-align:center}
.key .k{font:800 54px/1 var(--display);letter-spacing:-1.5px}
.key .sci{font:500 13px var(--display);color:var(--stage-muted);letter-spacing:.08em}
.cue{text-align:center;font-size:14px;color:var(--stage-muted);min-height:22px}
.stage.paused .cue{color:var(--stage-lamp);font-weight:500}
.lamps{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.lamp{min-width:36px;padding:7px 5px 5px;border-radius:11px;border:1px solid var(--stage-dim);text-align:center;display:grid;gap:1px;transition:background .12s,border-color .12s,transform .12s}
.lamp b{font:700 15px var(--body)}
.lamp small{font:500 10px var(--display);color:var(--stage-muted);letter-spacing:.03em}
.lamp.on{background:var(--stage-lamp);border-color:var(--stage-lamp);color:#2a1a05;transform:translateY(-3px)}
.lamp.on small{color:#5a4014}
.track{position:relative;display:grid;gap:4px;cursor:default}
.seek{width:100%;accent-color:var(--stage-lamp);height:28px;margin:0;cursor:pointer}
/* scrub bubble: follows the thumb while dragging, like a video player */
.scrub-tip{position:absolute;bottom:calc(100% - 2px);left:0;transform:translateX(-50%);background:var(--stage-lamp);color:#2a1a05;font:700 13px var(--display);font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:2}
.scrub-tip small{font:500 11px var(--body);margin-left:6px;color:#5a4014}
.scrub-tip.show{opacity:1}
.track.scrubbing #trackTime{color:var(--stage-lamp)}
@media (prefers-reduced-motion:reduce){.scrub-tip{transition:none}}
.track-meta{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--display);color:var(--stage-muted);font-variant-numeric:tabular-nums}

/* settings */
section{display:grid;gap:10px}
h2{margin:0;font:700 13px var(--body);letter-spacing:.08em;color:var(--muted)}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.tabs button,.seg button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:11px;padding:9px 4px;font-size:13px;font-weight:500;cursor:pointer}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
/* speed slider: 0.5x – 2x, 1x = the old "medium" */
.speed{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px 6px;display:grid;gap:2px}
.speed-head{display:flex;justify-content:space-between;align-items:baseline}
.speed-head .lbl{font-size:12px;color:var(--muted)}
.speed-head b{font:700 18px var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.speed-range{width:100%;height:28px;margin:0;accent-color:var(--accent);cursor:pointer}
.speed-ticks{display:flex;justify-content:space-between;margin:0 -4px}
.speed-ticks button{border:0;background:none;color:var(--muted);font:500 11px var(--display);padding:4px;cursor:pointer;border-radius:6px;min-width:34px}
.speed-ticks button:first-child{text-align:left}.speed-ticks button:last-child{text-align:right}
.speed-ticks button[aria-pressed="true"]{color:var(--accent);font-weight:700}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:1px}
.chip b{font-weight:700;font-size:14px}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:3px;width:100%}
.item[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.item .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .name{font-weight:700}
.item .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:11px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:1px 8px;white-space:nowrap;color:var(--muted)}
.pill.brass{color:var(--brass)}
.item .solf{font-size:14px;letter-spacing:.04em;color:var(--accent);font-weight:500}
.item .tip{font-size:12px;color:var(--muted)}
.item .del{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 4px;text-decoration:underline}
.empty{border:1px dashed var(--line);border-radius:16px;padding:14px;color:var(--muted);font-size:13px;text-align:center}

/* builder */
.builder{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:12px}
.seq{min-height:46px;border-radius:12px;background:var(--bg);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seq span{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:3px 9px;font-size:14px;font-weight:700}
.seq em{color:var(--muted);font-size:13px;font-style:normal}
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pad button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 2px;font-size:14px;font-weight:700;cursor:pointer}
.pad button small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
.brow{display:flex;gap:6px;flex-wrap:wrap}
.brow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}

.range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.step .lbl{font-size:12px;color:var(--muted)}
.step .ctl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.step .val{display:grid;text-align:center}
.step .val b{font-size:16px;font-weight:700}
.step .val small{font:500 11px var(--display);color:var(--muted)}
.round{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font:600 18px/1 var(--display);cursor:pointer;flex:none}
#panelBuild{display:grid;gap:12px}
.bhead{font-weight:700;font-size:14px}
.bhint{font-size:12px;color:var(--muted);margin:0}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{border:1px dashed var(--line);border-radius:10px;padding:8px;font-size:12px;min-height:54px;display:grid;align-content:start;gap:2px;background:var(--bg);text-align:left;cursor:pointer}
.slot.filled{border-style:solid;border-color:var(--accent)}
.slot b{font-size:11px;color:var(--accent)}
.slot span{font-weight:700;color:var(--ink)}
.slot.empty span{font-weight:400;color:var(--muted)}
.exlist{display:flex;flex-wrap:wrap;gap:6px}
.exlist button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.exlist button:disabled{opacity:.4;cursor:not-allowed}
.chips.v3{grid-template-columns:repeat(3,minmax(0,1fr))}
.chips.v3 .chip{padding:9px 10px}
.vgroup{display:grid;gap:6px}
.vgroup-label{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--ink)}
.vgroup-label::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--accent)}
details.manual{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px}
details.manual summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
details.manual[open] summary{margin-bottom:10px}
details.manual .range .step{background:var(--bg)}
.meter{display:grid;gap:6px;cursor:default}
.meter-bar{position:relative;height:10px;border-radius:999px;background:var(--stage-dim)}
.meter-bar::before{content:"";position:absolute;left:30%;right:30%;top:0;bottom:0;border-radius:999px;background:color-mix(in srgb,var(--good) 40%,transparent)}
.meter-bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--stage-muted);transform:translateX(-50%)}
.needle{position:absolute;top:-5px;width:6px;height:20px;border-radius:3px;background:var(--stage-muted);left:50%;transform:translateX(-50%);transition:left .15s ease-out,background-color .2s;z-index:1}
.needle.good{background:var(--good)} .needle.warn{background:var(--warn)} .needle.off{background:var(--off)}
.meter-text{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--body);color:var(--stage-muted);font-variant-numeric:tabular-nums}
.verdict{font-weight:700;color:var(--stage-ink)}
.verdict.good{color:var(--good)} .verdict.warn{color:var(--warn)} .verdict.off{color:var(--off)}
.micbox{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.micbtn{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;cursor:pointer}
.micbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.micmsg{font-size:12px;color:var(--muted);margin:0}
.micmsg.err{color:var(--accent);font-weight:500}
.summary{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.warn{font-size:13px;color:var(--accent);font-weight:500}
.note{font-size:12px;color:var(--muted);margin:0}

/* play bar */
.playbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.playbar .in{max-width:480px;margin:0 auto;display:flex;gap:8px}
.play{flex:1;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:700;padding:15px;cursor:pointer}
.reset{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0 16px;font-size:14px;cursor:pointer}
.play:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){.lamp{transition:none}.lamp.on{transform:none}}
</style>

<div class="app">
  <header>
    <div class="brandwrap">
      <div class="brand">Curtain<span>Up</span></div>
      <div class="tag" data-t="tagline"></div>
    </div>
    <select class="lang" id="lang" aria-label="Language">
      <option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">简体中文</option><option value="es">Español</option>
    </select>
  </header>

  <div class="stage" id="stage" role="button" tabindex="0">
    <div class="stage-top"><span class="live"><i></i><span id="liveText"></span></span><span id="exName"></span></div>
    <div class="key"><span class="k" id="keyK"></span><span class="sci" id="keySci"></span></div>
    <div class="lamps" id="lamps"></div>
    <div class="meter" id="meter" hidden>
      <div class="meter-bar"><span class="needle" id="needle"></span></div>
      <div class="meter-text"><span data-t="mLow"></span><span class="verdict" id="verdict"></span><span data-t="mHigh"></span></div>
      <div class="meter-text"><span id="myNote"></span><span id="score"></span></div>
    </div>
    <div class="cue" id="cue"></div>
    <div class="track" id="track">
      <div class="scrub-tip" id="scrubTip" aria-hidden="true"></div>
      <input class="seek" id="seek" type="range" min="0" max="0" step="0.1" value="0">
      <div class="track-meta"><span id="trackPos"></span><span id="trackTime">0:00</span></div>
    </div>
  </div>

  <section>
    <h2 data-t="hMic"></h2>
    <div class="micbox">
      <button class="micbtn" id="micBtn" aria-pressed="false"></button>
      <label class="check"><input type="checkbox" id="noMelody"><span data-t="noMelody"></span></label>
      <div class="micvol" id="micVolBox" hidden><div class="speed-head"><label class="lbl" for="micVol" data-t="micVol"></label><b id="micVolVal"></b></div>
        <input class="speed-range" id="micVol" type="range" min="0.1" max="1" step="0.05"></div>
      <p class="micmsg" id="micMsg"></p>
    </div>
  </section>

  <section>
    <h2 data-t="hVoice"></h2>
    <p class="note" data-t="voiceHint"></p>
    <div class="vgroup"><span class="vgroup-label" data-t="male"></span><div class="chips v3" id="voicesM"></div></div>
    <div class="vgroup"><span class="vgroup-label" data-t="female"></span><div class="chips v3" id="voicesF"></div></div>
  </section>

  <section>
    <h2 data-t="hMode"></h2>
    <div class="tabs" role="tablist" id="modeTabs">
      <button role="tab" data-v="single" data-t="tabSingle"></button>
      <button role="tab" data-v="routine" data-t="tabRoutine"></button>
      <button role="tab" data-v="build" data-t="tabBuild"></button>
    </div>
    <div id="panelSingle" class="list"></div>
    <div id="panelRoutine" class="list" hidden></div>
    <div id="panelBuild" hidden></div>
  </section>

  <details class="manual" id="manual">
    <summary data-t="manual"></summary>
    <div class="range">
      <div class="step"><span class="lbl" data-t="low"></span>
        <div class="ctl"><button class="round" id="lowDown">−</button><span class="val"><b id="lowK"></b><small id="lowS"></small></span><button class="round" id="lowUp">+</button></div>
      </div>
      <div class="step"><span class="lbl" data-t="top"></span>
        <div class="ctl"><button class="round" id="topDown">−</button><span class="val"><b id="topK"></b><small id="topS"></small></span><button class="round" id="topUp">+</button></div>
      </div>
    </div>
  </details>

  <section>
    <h2 data-t="hTempo"></h2>
    <div class="speed" id="speedBox">
      <div class="speed-head"><label class="lbl" for="speed" data-t="speedLbl"></label><b id="speedVal">1.0×</b></div>
      <input class="speed-range" id="speed" type="range" min="0.5" max="2" step="0.05" value="1">
      <div class="speed-ticks" id="speedTicks"><button data-v="0.5">0.5×</button><button data-v="1">1×</button><button data-v="1.5">1.5×</button><button data-v="2">2×</button></div>
    </div>
    <div class="seg" id="dir">
      <button data-v="both" data-t="both"></button><button data-v="up" data-t="up"></button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="warn" id="warn" hidden></div>
  </section>

  <p class="note" data-t="note"></p>
</div>

<div class="playbar"><div class="in"><button class="reset" id="resetBtn" data-t="reset"></button><button class="play" id="playBtn"></button></div></div>

<script>
/* ---------- i18n ---------- */
const T = {
ko:{ tagline:'노래하기 전 가볍게 목풀기', hVoice:'내 목소리', hMode:'연습 방식', tabSingle:'연습 하나', tabRoutine:'루틴 코스', tabBuild:'내 패턴 만들기',
  hRange:'음역', low:'시작 키', top:'가장 높은 음', hTempo:'속도와 방향', slow:'느리게', medium:'보통', fast:'빠르게', both:'올라갔다 내려오기', up:'올라가기만',
  note:'연습 화면을 누르면 일시정지, 다시 누르면 그 키의 화음부터 이어서 재생돼요. 진행 막대를 끌면 원하는 키로 이동해요. 아이폰은 무음 모드를 끄면 소리가 나요. 목이 아프면 바로 멈추고 쉬어 주세요.',

    + (list.length ? list.map(e => exItem(e, S.mode === 'single' && S.ex === e.id)).join('') : `<div class="empty">${t().emptyMine}</div>`);
}
function routineTime(r){
  const keep = { mode:S.mode, routine:S.routine }; S.mode = 'routine'; S.routine = r.id;
  const p = buildPlan(); Object.assign(S, keep);
  return p.empty ? t().narrow : t().approx(fmt(p.total));
}
function renderRoutine(){
  $('panelRoutine').innerHTML = allRoutines().filter(r => r.id !== 'mr-draft').map(r => `<div class="item" role="button" tabindex="0" data-routine="${r.id}" aria-pressed="${S.mode === 'routine' && S.routine === r.id}">
    <span class="row1"><span class="name">${esc(routineName(r))}</span><span class="meta">${isMine(r) ? `<span class="pill brass">${t().myTag}</span>` : ''}<span class="pill">${routineTime(r)}</span></span></span>
    ${isMine(r) ? '' : `<span class="tip">${t().routines[r.id][1]}</span>`}
    <span class="solf">${r.items.map(id => esc(exName(exById(id)))).filter(Boolean).join(' → ')}</span>
    ${isMine(r) ? `<span><button class="del" data-delr="${r.id}">${t().del}</button></span>` : ''}</div>`).join('');
}
const PAD = [0,2,4,5,7,9,11,12,14,16];
let draft = [], combo = [];
function renderBuild(){
  const keepName = $('bName') ? $('bName').value : '', keepC = $('cName') ? $('cName').value : '';
  const pickable = allEx().filter(e => e.id !== 'my-draft');
  $('panelBuild').innerHTML = `<div class="builder">
    <div class="bhead">${t().comboTitle}</div>
    <p class="bhint">${t().comboHint}</p>
    <div class="slots">${[0,1,2].map(i => combo[i]
      ? `<button class="slot filled" data-slot="${i}"><b>${i + 1}</b><span>${esc(exName(exById(combo[i])))}</span></button>`
      : `<div class="slot empty"><b>${i + 1}</b><span>${t().slotEmpty}</span></div>`).join('')}</div>
    <div class="exlist">${pickable.map(e => `<button data-add="${e.id}" ${combo.length >= 3 ? 'disabled' : ''}>${esc(exName(e))}</button>`).join('')}</div>
    <div class="brow"><button class="btn" id="cTry" ${combo.length >= 2 ? '' : 'disabled'}>${t().tryIt}</button></div>
    <div class="brow"><input id="cName" maxlength="20" placeholder="${esc(t().comboNamePh)}"><button class="btn primary" id="cSave" ${combo.length >= 2 ? '' : 'disabled'}>${t().save}</button></div>
  </div>
  <div class="builder">
    <div class="bhead">${t().patTitle}</div>
    <div class="seq">${draft.length ? draft.map(iv => `<span>${degName(iv)}</span>`).join('') : `<em>${t().seqHint}</em>`}</div>
    <div class="pad">${PAD.map(iv => `<button data-iv="${iv}">${degName(iv)}<small>${iv >= 12 ? t().octUp : '&nbsp;'}</small></button>`).join('')}</div>
    <div class="brow"><button class="btn" id="bUndo" ${draft.length ? '' : 'disabled'}>${t().undo}</button><button class="btn" id="bClear" ${draft.length ? '' : 'disabled'}>${t().clear}</button><button class="btn" id="bTry" ${draft.length >= 2 ? '' : 'disabled'}>${t().tryIt}</button></div>
    <div class="brow"><input id="bName" maxlength="20" placeholder="${esc(t().namePh)}"><button class="btn primary" id="bSave" ${draft.length >= 2 ? '' : 'disabled'}>${t().save}</button></div>
  </div>`;
  $('bName').value = keepName; $('cName').value = keepC;
}
function renderStatic(){
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t()[el.dataset.t]);
  $('lang').value = L;
  $('stage').setAttribute('aria-label', t().stageAria);
  $('seek').setAttribute('aria-label', t().seekAria);
  ['lowDown','lowUp','topDown','topUp'].forEach(id => $(id).setAttribute('aria-label', t()[id]));
}
function renderControls(){
  const chip = v => `<button class="chip" data-id="${v.id}" aria-pressed="${S.voice === v.id}"><b>${t().voices[v.id][0]}</b><small>${sci(v.low)}–${sci(v.top)}</small></button>`;
  $('voicesM').innerHTML = VOICES.filter(v => v.g === 'm').map(chip).join('');
  $('voicesF').innerHTML = VOICES.filter(v => v.g === 'f').map(chip).join('');
  document.querySelectorAll('#modeTabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === tab));
  $('panelSingle').hidden = tab !== 'single'; $('panelRoutine').hidden = tab !== 'routine'; $('panelBuild').hidden = tab !== 'build';
  renderSingle(); renderRoutine(); if (tab === 'build') renderBuild();
  $('lowK').textContent = keyBig(S.low); $('lowS').textContent = L === 'ko' ? sci(S.low) : keySmall(S.low);
  $('topK').textContent = keyBig(S.top); $('topS').textContent = L === 'ko' ? sci(S.top) : keySmall(S.top);
  showSpeed(S.speed);
  document.querySelectorAll('#dir button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.dir));
  const sk = P.skipped || [];
  $('warn').hidden = !sk.length && !P.empty;
  $('warn').textContent = P.empty ? t().warnNarrow : sk.length ? t().warnSkipped(sk.map(exName).join(', ')) : '';
  $('summary').textContent = P.empty ? '' : t().summary(keyBig(S.low), keyBig(P.hi), P.keys.length, fmt(P.total));
}
function change(fn){ fn(); persist(); toIdle(); renderControls(); }

$('lang').onchange = e => { L = S.lang = e.target.value; persist(); lampSig = ''; renderStatic(); renderControls(); renderMic(); paint(); };
$('stage').addEventListener('click', e => { if (e.target.closest('#track')) return; state === 'playing' ? pause() : play(); });
$('stage').addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest('#track')) { e.preventDefault(); state === 'playing' ? pause() : play(); } });
/* scrubbing: drag shows time + key in a bubble; release jumps to the start of that key (its chord) */
let scrubbing = false, scrubVal = 0;
function scrubTipAt(v){
  const seek = $('seek'), tip = $('scrubTip'), max = +seek.max || 1;
  tip.innerHTML = `${fmt(v)}<small>${keyBig(P.keys[keyAt(v)].root)}</small>`;
  const w = seek.clientWidth, thumb = 16, x = (v / max) * (w - thumb) + thumb / 2, half = tip.offsetWidth / 2;
  tip.style.left = Math.min(Math.max(x, half), w - half) + 'px';
  tip.classList.add('show');
}
function scrubTo(v){
  scrubbing = true; scrubVal = v;
  $('track').classList.add('scrubbing'); scrubTipAt(v);
  if (state === 'playing') showAt(v, false);
  else { pos = v; state = 'paused'; paint(); }
}
function endScrub(){
  if (!scrubbing) return;
  scrubbing = false;
  $('track').classList.remove('scrubbing'); $('scrubTip').classList.remove('show');
  seekKey(keyAt(scrubVal));
}
$('seek').addEventListener('input', e => { if (!P.empty) scrubTo(+e.target.value); });
$('seek').addEventListener('change', endScrub);
['pointerup', 'pointercancel', 'blur'].forEach(ev => $('seek').addEventListener(ev, endScrub));
$('seek').addEventListener('keydown', e => { // arrow keys still step one key at a time
  if (P.empty) return;
  const cur = keyAt(state === 'playing' ? ctx.currentTime - t0 : pos), last = P.keys.length - 1;
  const to = { ArrowLeft: cur - 1, ArrowDown: cur - 1, PageDown: cur - 1, ArrowRight: cur + 1, ArrowUp: cur + 1, PageUp: cur + 1, Home: 0, End: last }[e.key];
  if (to === undefined) return;
  e.preventDefault(); seekKey(Math.min(Math.max(to, 0), last));
});
$('playBtn').onclick = () => state === 'playing' ? pause() : play();
$('resetBtn').onclick = () => toIdle();
['voicesM','voicesF'].forEach(id => $(id).onclick = e => { const b = e.target.closest('.chip'); if (!b) return;
  change(() => { const v = VOICES.find(x => x.id === b.dataset.id); S.voice = v.id; S.low = v.low; S.top = v.top; }); });
$('micBtn').onclick = () => mic ? micOff() : micOn();
$('micVol').oninput = e => { S.micVol = +e.target.value; persist(); applyLevel(); $('micVolVal').textContent = Math.round(S.micVol * 100) + '%'; };
$('noMelody').onchange = e => { S.noMelody = e.target.checked; persist(); };
$('modeTabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.v; renderControls(); };
function pick(e){
  const delr = e.target.closest('[data-delr]');
  if (delr) { e.stopPropagation(); change(() => { S.myRoutines = S.myRoutines.filter(r => r.id !== delr.dataset.delr); if (S.routine === delr.dataset.delr) { S.routine = 'light'; } }); return; }
  const del = e.target.closest('[data-del]');
  if (del) { e.stopPropagation(); change(() => { S.custom = S.custom.filter(c => c.id !== del.dataset.del); if (S.ex === del.dataset.del) S.ex = 'arp'; }); return; }
  const cat = e.target.closest('[data-cat]'); if (cat) { S.cat = cat.dataset.cat; persist(); renderSingle(); return; }
  const it = e.target.closest('.item'); if (!it) return;
  if (it.dataset.routine) change(() => { S.mode = 'routine'; S.routine = it.dataset.routine; });
  else change(() => { S.mode = 'single'; S.ex = it.dataset.id; });
}
['panelSingle','panelRoutine'].forEach(id => {
  $(id).addEventListener('click', pick);
  $(id).addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('item')) { e.preventDefault(); pick(e); } });
});
$('panelBuild').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.add) { if (combo.length < 3) combo.push(b.dataset.add); }
  else if (b.dataset.slot !== undefined) combo.splice(+b.dataset.slot, 1);
  else if (b.id === 'cTry') { if (combo.length < 2) return;
    S.myRoutines = S.myRoutines.filter(r => r.id !== 'mr-draft').concat({ id:'mr-draft', name:'', items:combo.slice() });
    change(() => { S.mode = 'routine'; S.routine = 'mr-draft'; }); begin(0); return; }
  else if (b.id === 'cSave') { if (combo.length < 2) return;
    const name = ($('cName').value || '').trim() || t().myRoutineN(S.myRoutines.filter(r => r.id !== 'mr-draft').length + 1);
    const item = { id:'mr-' + Date.now(), name, items:combo.slice() };
    combo = []; $('cName').value = ''; tab = 'routine';
    change(() => { S.myRoutines = S.myRoutines.filter(r => r.id !== 'mr-draft').concat(item); S.mode = 'routine'; S.routine = item.id; });
    return; }
  else if (b.dataset.iv !== undefined) { if (draft.length < 16) draft.push(+b.dataset.iv); }
  else if (b.id === 'bUndo') draft.pop();
  else if (b.id === 'bClear') draft = [];
  else if (b.id === 'bTry') { if (draft.length < 2) return;
    const tmp = { id:'my-draft', name:'', pat:draft.slice(), cat:'mine' };
    S.custom = S.custom.filter(c => c.id !== 'my-draft').concat(tmp);
    change(() => { S.mode = 'single'; S.ex = 'my-draft'; }); begin(0); return; }
  else if (b.id === 'bSave') { if (draft.length < 2) return;
    const name = ($('bName').value || '').trim() || t().myN(S.custom.filter(c => c.id !== 'my-draft').length + 1);
    const item = { id:'my-' + Date.now(), name, pat:draft.slice(), cat:'mine' };
    draft = []; $('bName').value = ''; tab = 'single';
    change(() => { S.custom = S.custom.filter(c => c.id !== 'my-draft').concat(item); S.mode = 'single'; S.ex = item.id; S.cat = 'mine'; });
    return; }
  renderBuild();
});
/* speed: dragging updates the label and estimated time; releasing applies it, keeping the current key */
function showSpeed(x){
  $('speed').value = x; $('speedVal').textContent = fmtSpeed(x);
  $('speed').setAttribute('aria-valuetext', fmtSpeed(x));
  document.querySelectorAll('#speedTicks button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === x));
}
function previewSpeed(x){
  const keep = S.speed; S.speed = x; const pl = buildPlan(); S.speed = keep;
  $('speedVal').textContent = fmtSpeed(x);
  document.querySelectorAll('#speedTicks button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === x));
  $('summary').textContent = pl.empty ? '' : t().summary(keyBig(S.low), keyBig(pl.hi), pl.keys.length, fmt(pl.total));
}
function applySpeed(x){
  x = clampSpeed(x); if (x === S.speed) { showSpeed(x); return; }
  const was = state, k = was === 'playing' ? keyAt(ctx.currentTime - t0) : keyAt(pos);
  S.speed = x; persist();
  if (was === 'playing' || was === 'paused') {
    P = buildPlan();
    if (P.empty) toIdle();
    else { pos = P.keys[Math.min(k, P.keys.length - 1)].t; if (was === 'playing') begin(pos); else paint(); }
  } else toIdle();
  renderControls();
}
$('speed').addEventListener('input', e => previewSpeed(clampSpeed(+e.target.value)));
$('speed').addEventListener('change', e => applySpeed(+e.target.value));
$('speedTicks').onclick = e => { const b = e.target.closest('button'); if (b) applySpeed(+b.dataset.v); };
$('dir').onclick = e => { const b = e.target.closest('button'); if (b) change(() => S.dir = b.dataset.v); };
$('lowDown').onclick = () => change(() => S.low = Math.max(36, S.low - 1));
$('lowUp').onclick = () => change(() => S.low = Math.min(S.top, S.low + 1));
$('topDown').onclick = () => change(() => S.top = Math.max(S.low, S.top - 1));
$('topUp').onclick = () => change(() => S.top = Math.min(91, S.top + 1));

if (!exById(S.ex)) S.ex = 'arp';
if (!allRoutines().some(r => r.id === S.routine)) S.routine = 'light';
P = buildPlan(); renderStatic(); renderControls(); renderMic(); paint();
</script>
